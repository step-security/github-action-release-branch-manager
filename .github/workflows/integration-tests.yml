name: "Integration Tests"

on:
  workflow_dispatch: {}

  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 16

      - name: Configure Git
        run: git config --global init.defaultBranch main

      - name: Install Node Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build dist
        run: npm run build

      - name: Check dist is up to date
        run: |
          if [ -n "$(git diff --name-only dist/)" ]; then
            echo "dist/index.js is out of date. Run 'npm run build' and commit the result."
            git diff dist/
            exit 1
          fi

      - name: Run Tests
        env:
          LOG_LEVEL: 'debug'
        run: npm test

  test-positive:
    uses: ./.github/workflows/test-positive.yml
